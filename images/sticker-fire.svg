<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="fireGradient1" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#F7931E"/>
      <stop offset="100%" style="stop-color:#FFD93D"/>
    </linearGradient>
    <linearGradient id="fireGradient2" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <filter id="fireShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#FF450040"/>
    </filter>
  </defs>
  <g filter="url(#fireShadow)">
    <!-- Outer flame -->
    <path d="M100 30 Q130 70 140 100 Q150 130 140 150 Q130 175 100 180 Q70 175 60 150 Q50 130 60 100 Q70 70 100 30" 
          fill="url(#fireGradient1)"/>
    <!-- Inner flame -->
    <path d="M100 60 Q120 85 125 105 Q130 130 120 145 Q110 160 100 165 Q90 160 80 145 Q70 130 75 105 Q80 85 100 60" 
          fill="url(#fireGradient2)"/>
    <!-- Core -->
    <path d="M100 90 Q110 105 115 115 Q120 130 110 140 Q105 145 100 148 Q95 145 90 140 Q80 130 85 115 Q90 105 100 90" 
          fill="#FFEB3B"/>
  </g>
</svg>
