<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hundredGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <filter id="hundredShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>
  <g filter="url(#hundredShadow)">
    <text x="100" y="115" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="url(#hundredGradient)" text-anchor="middle">100</text>
    <line x1="35" y1="145" x2="165" y2="145" stroke="url(#hundredGradient)" stroke-width="8" stroke-linecap="round"/>
    <line x1="35" y1="160" x2="165" y2="160" stroke="url(#hundredGradient)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
