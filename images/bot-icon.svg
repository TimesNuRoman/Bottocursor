  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#botGradient)"/>
  <!-- Antenna -->
  <line x1="100" y1="30" x2="100" y2="50" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="25" r="8" fill="#FF6B6B"/>
