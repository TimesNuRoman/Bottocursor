  <circle cx="78" cy="92" r="5" fill="#FFF"/>
  <circle cx="128" cy="92" r="5" fill="#FFF"/>
  <!-- Mouth -->
  <rect x="70" y="120" width="60" height="10" rx="5" fill="#5856D6"/>
  <!-- Ears -->
